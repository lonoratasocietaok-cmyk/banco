<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pagos Descentralizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #6b7a8f;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            font-weight: 600;
            font-size: 13px;
            color: #2d3a4f;
            display: block;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e4e9f0;
            border-radius: 16px;
            font-size: 15px;
            transition: 0.2s;
            background: #fafcfe;
        }
        input:focus {
            outline: none;
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0,158,227,0.1);
        }
        button {
            background: #009ee3;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            margin-top: 8px;
        }
        button:hover {
            background: #0088c4;
            transform: scale(1.01);
        }
        button.secondary {
            background: #eef2f6;
            color: #1a1a2e;
        }
        button.secondary:hover {
            background: #e4e9f0;
        }
        button.danger {
            background: #ff4757;
        }
        button.danger:hover {
            background: #e0313f;
        }
        .card {
            background: #f8fafd;
            border-radius: 20px;
            padding: 18px;
            margin-top: 16px;
            border: 1px solid #eef2f6;
        }
        .balance {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .balance small {
            font-size: 16px;
            font-weight: 400;
            color: #6b7a8f;
        }
        .tx-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .tx-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eef2f6;
            font-size: 14px;
        }
        .tx-item .info {
            display: flex;
            flex-direction: column;
        }
        .tx-item .info .detail {
            font-size: 12px;
            color: #8a9aa8;
        }
        .tx-item .amount {
            font-weight: 700;
        }
        .tx-item .amount.positive { color: #00a86b; }
        .tx-item .amount.negative { color: #ff4757; }
        .hidden { display: none !important; }
        .alert {
            background: #fff3cd;
            color: #856404;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 12px 0;
            font-size: 14px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        .flex {
            display: flex;
            gap: 12px;
        }
        .flex button {
            flex: 1;
        }
        .password-box {
            background: #f0f2f5;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
            margin: 8px 0;
            border: 2px dashed #009ee3;
        }
        .badge {
            background: #009ee3;
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Pantalla de Login / Registro -->
    <div id="authScreen">
        <h1>🔐 Pago <span style="color:#009ee3;">D</span><small>centralizado</small></h1>
        <div id="authForm">
            <div class="form-group">
                <label>👤 Usuario</label>
                <input type="text" id="authUsername" placeholder="Ej: juan">
            </div>
            <div class="form-group">
                <label>🔑 Contraseña</label>
                <input type="password" id="authPassword" placeholder="Tu contraseña">
            </div>
            <button id="loginBtn">Iniciar sesión</button>
            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eef2f6;">
            <button class="secondary" id="registerBtn">🆕 Crear nueva cuenta</button>
        </div>
        <div id="registerInfo" class="hidden">
            <div class="alert alert-success">✅ Cuenta creada con éxito</div>
            <p><strong>Usuario:</strong> <span id="newUsername"></span></p>
            <p><strong>Contraseña generada:</strong></p>
            <div class="password-box" id="newPassword"></div>
            <p style="font-size: 13px; color: #6b7a8f;">⚠️ Guarda esta contraseña, no podrás recuperarla.</p>
            <button id="goToLoginBtn">Volver a iniciar sesión</button>
        </div>
    </div>

    <!-- Panel principal (logueado) -->
    <div id="dashboardScreen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h1 style="margin:0;">💳 PagoD</h1>
            <div>
                <span class="badge" id="currentUserDisplay"></span>
                <button class="secondary" id="logoutBtn" style="width:auto; padding: 8px 16px; margin-left: 8px;">Cerrar</button>
            </div>
        </div>

        <!-- Saldo -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 500; color: #2d3a4f;">💰 Saldo disponible</span>
                <span id="balanceDisplay" class="balance">0 <small>USD</small></span>
            </div>
        </div>

        <!-- Enviar dinero -->
        <div class="card" style="border-color: #009ee3;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">✉️ Enviar dinero</h3>
            <div class="form-group">
                <label>Destinatario</label>
                <input type="text" id="sendTo" placeholder="Nombre de usuario">
            </div>
            <div class="form-group">
                <label>Cantidad (USD)</label>
                <input type="number" id="sendAmount" placeholder="0.00" step="0.01" min="0">
            </div>
            <button id="sendBtn">Enviar</button>
            <div id="sendResult" class="alert hidden"></div>
        </div>

        <!-- Historial de transacciones -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 16px;">📋 Historial</h3>
                <span style="font-size: 12px; color: #8a9aa8;" id="txCount">0 transacciones</span>
            </div>
            <div id="transactionList" class="tx-list">
                <div style="color: #8a9aa8; text-align: center; padding: 20px;">No hay movimientos</div>
            </div>
        </div>

        <!-- Otros usuarios (nodos) -->
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 8px;">🌐 Nodos en la red</h3>
            <div id="nodeList" style="font-size: 14px; color: #2d3a4f; display: flex; flex-wrap: wrap; gap: 8px;">
                <span style="background: #eef2f6; padding: 4px 12px; border-radius: 40px;">Cargando...</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- UTILIDADES ----------
    function generatePassword(length = 10) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let pwd = '';
        for (let i = 0; i < length; i++) {
            pwd += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return pwd;
    }

    // Hash simple (simula firma)
    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; // Convertir a 32bit
        }
        return '0x' + Math.abs(hash).toString(16).padStart(8, '0');
    }

    // Obtener todos los usuarios registrados
    function getUsersList() {
        try {
            return JSON.parse(localStorage.getItem('usersList')) || [];
        } catch { return []; }
    }

    function saveUsersList(list) {
        localStorage.setItem('usersList', JSON.stringify(list));
    }

    // Obtener datos de un usuario
    function getUserData(username) {
        try {
            const raw = localStorage.getItem('user_' + username);
            return raw ? JSON.parse(raw) : null;
        } catch { return null; }
    }

    function saveUserData(username, data) {
        localStorage.setItem('user_' + username, JSON.stringify(data));
    }

    // Registrar nuevo usuario
    function registerUser(username) {
        const users = getUsersList();
        if (users.includes(username)) {
            return { success: false, error: 'El usuario ya existe' };
        }
        const password = generatePassword();
        const newUser = {
            username: username,
            password: password,
            balance: 1000, // Saldo inicial para probar
            nonce: 0,
            transactions: []
        };
        saveUserData(username, newUser);
        users.push(username);
        saveUsersList(users);
        return { success: true, password: password };
    }

    // Validar credenciales
    function authenticate(username, password) {
        const data = getUserData(username);
        if (!data) return false;
        return data.password === password;
    }

    // Obtener saldo actual
    function getBalance(username) {
        const data = getUserData(username);
        return data ? data.balance : 0;
    }

    // ---------- VALIDACIÓN POR CONSENSO (SIMULADA) ----------
    function validateTransaction(sender, receiver, amount, txHash, nonce) {
        // Obtener todos los usuarios excepto el remitente
        const users = getUsersList();
        const otherNodes = users.filter(u => u !== sender);
        if (otherNodes.length === 0) {
            // Si no hay otros nodos, se valida solo con el remitente (caso extremo)
            return true;
        }

        // Cada nodo verifica:
        // 1. Que el remitente tenga saldo suficiente en su propio registro
        // 2. Que el hash coincida con el calculado localmente
        // 3. Que el nonce sea el esperado

        let approvals = 0;
        const required = Math.max(1, Math.floor(otherNodes.length * 0.6)); // 60%+1

        // Simulamos que cada nodo hace su verificación de forma independiente
        // En realidad, en un sistema P2P cada nodo tendría su propia copia del ledger.
        // Para simplificar, usamos los datos almacenados localmente (que son los mismos para todos).
        const senderData = getUserData(sender);
        if (!senderData) return false;

        // Verificar saldo
        if (senderData.balance < amount) {
            return false; // Saldo insuficiente
        }

        // Verificar nonce
        if (senderData.nonce !== nonce) {
            return false;
        }

        // Verificar hash (recalculamos)
        const computedHash = simpleHash(`${sender}${receiver}${amount}${nonce}`);
        if (computedHash !== txHash) {
            return false;
        }

        // Si pasa las verificaciones locales, lo consideramos aprobado por todos los nodos
        // (ya que todos tienen la misma información).
        // En una red real, cada nodo tendría su propia copia y podría diferir.
        // Aquí asumimos que todos están sincronizados.
        return true;
    }

    // ---------- REALIZAR TRANSACCIÓN ----------
    function performTransaction(sender, receiver, amount) {
        if (sender === receiver) {
            return { success: false, error: 'No puedes enviarte a ti mismo' };
        }

        const senderData = getUserData(sender);
        const receiverData = getUserData(receiver);
        if (!senderData) return { success: false, error: 'Remitente no encontrado' };
        if (!receiverData) return { success: false, error: 'Destinatario no encontrado' };

        if (amount <= 0) return { success: false, error: 'Monto inválido' };
        if (senderData.balance < amount) return { success: false, error: 'Saldo insuficiente' };

        // Generar transacción
        const nonce = senderData.nonce;
        const timestamp = Date.now();
        const txHash = simpleHash(`${sender}${receiver}${amount}${nonce}`);

        // Validación por consenso
        const valid = validateTransaction(sender, receiver, amount, txHash, nonce);
        if (!valid) {
            return { success: false, error: 'La transacción no fue validada por la red' };
        }

        // Aplicar cambios
        senderData.balance -= amount;
        senderData.nonce += 1;
        senderData.transactions.push({
            from: sender,
            to: receiver,
            amount: -amount,
            timestamp: timestamp,
            hash: txHash,
            type: 'enviado'
        });

        receiverData.balance += amount;
        receiverData.transactions.push({
            from: sender,
            to: receiver,
            amount: amount,
            timestamp: timestamp,
            hash: txHash,
            type: 'recibido'
        });

        // Guardar
        saveUserData(sender, senderData);
        saveUserData(receiver, receiverData);

        return { success: true, hash: txHash };
    }

    // ---------- UI ----------
    let currentUser = null;

    function showDashboard(username) {
        currentUser = username;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        document.getElementById('currentUserDisplay').textContent = '@' + username;
        refreshDashboard();
    }

    function refreshDashboard() {
        if (!currentUser) return;
        const data = getUserData(currentUser);
        if (!data) {
            logout();
            return;
        }

        // Saldo
        document.getElementById('balanceDisplay').innerHTML = `${data.balance.toFixed(2)} <small>USD</small>`;

        // Transacciones
        const txList = document.getElementById('transactionList');
        const count = document.getElementById('txCount');
        count.textContent = data.transactions.length + ' transacciones';
        if (data.transactions.length === 0) {
            txList.innerHTML = '<div style="color: #8a9aa8; text-align: center; padding: 20px;">No hay movimientos</div>';
        } else {
            txList.innerHTML = data.transactions.slice().reverse().map(tx => {
                const sign = tx.amount >= 0 ? '+' : '';
                const cls = tx.amount >= 0 ? 'positive' : 'negative';
                const label = tx.type === 'enviado' ? `Enviado a ${tx.to}` : `Recibido de ${tx.from}`;
                return `
                    <div class="tx-item">
                        <div class="info">
                            <span>${label}</span>
                            <span class="detail">${new Date(tx.timestamp).toLocaleString()} • ${tx.hash.slice(0,10)}</span>
                        </div>
                        <div class="amount ${cls}">${sign} ${Math.abs(tx.amount).toFixed(2)} USD</div>
                    </div>
                `;
            }).join('');
        }

        // Lista de nodos
        const users = getUsersList();
        const nodeContainer = document.getElementById('nodeList');
        if (users.length === 0) {
            nodeContainer.innerHTML = '<span style="background: #eef2f6; padding: 4px 12px; border-radius: 40px;">Sin otros nodos</span>';
        } else {
            nodeContainer.innerHTML = users.map(u => 
                `<span style="background: ${u === currentUser ? '#009ee3' : '#eef2f6'}; color: ${u === currentUser ? 'white' : '#2d3a4f'}; padding: 4px 12px; border-radius: 40px;">${u}</span>`
            ).join(' ');
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('authUsername').value = '';
        document.getElementById('authPassword').value = '';
        document.getElementById('registerInfo').classList.add('hidden');
        document.getElementById('authForm').classList.remove('hidden');
    }

    // ---------- EVENTOS ----------
    document.addEventListener('DOMContentLoaded', function() {
        // Registro
        document.getElementById('registerBtn').addEventListener('click', function() {
            const username = document.getElementById('authUsername').value.trim();
            if (!username) {
                alert('Ingresa un nombre de usuario');
                return;
            }
            const result = registerUser(username);
            if (!result.success) {
                alert(result.error);
                return;
            }
            // Mostrar contraseña generada
            document.getElementById('newUsername').textContent = username;
            document.getElementById('newPassword').textContent = result.password;
            document.getElementById('registerInfo').classList.remove('hidden');
            document.getElementById('authForm').classList.add('hidden');
        });

        document.getElementById('goToLoginBtn').addEventListener('click', function() {
            document.getElementById('registerInfo').classList.add('hidden');
            document.getElementById('authForm').classList.remove('hidden');
        });

        // Login
        document.getElementById('loginBtn').addEventListener('click', function() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) {
                alert('Completa ambos campos');
                return;
            }
            if (!authenticate(username, password)) {
                alert('Usuario o contraseña incorrectos');
                return;
            }
            showDashboard(username);
        });

        // Cerrar sesión
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Enviar dinero
        document.getElementById('sendBtn').addEventListener('click', function() {
            const to = document.getElementById('sendTo').value.trim();
            const amount = parseFloat(document.getElementById('sendAmount').value);
            const resultDiv = document.getElementById('sendResult');

            if (!to || !amount || amount <= 0) {
                resultDiv.className = 'alert';
                resultDiv.textContent = '❌ Ingresa destinatario y monto válido';
                resultDiv.classList.remove('hidden');
                return;
            }

            const result = performTransaction(currentUser, to, amount);
            if (!result.success) {
                resultDiv.className = 'alert';
                resultDiv.textContent = '❌ ' + result.error;
                resultDiv.classList.remove('hidden');
            } else {
                resultDiv.className = 'alert alert-success';
                resultDiv.textContent = '✅ Transacción exitosa. Hash: ' + result.hash.slice(0, 16) + '...';
                resultDiv.classList.remove('hidden');
                document.getElementById('sendTo').value = '';
                document.getElementById('sendAmount').value = '';
                refreshDashboard();
                // Ocultar mensaje después de 5s
                setTimeout(() => resultDiv.classList.add('hidden'), 5000);
            }
        });

        // Enter en login
        document.getElementById('authPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
        document.getElementById('authUsername').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        // Si hay sesión activa (por si recarga)
        // No mantenemos sesión, siempre pide login.
    });
</script>
</body>
</html>
